7.What are fixtures in Playwright, and why are they important for building scalable frameworks?

Fixtures in Playwright are reusable setup functions that provide dependencies to tests.

Examples:

browser

page

API context

login session

page objects

Example custom fixture:


 customeFixture.ts

export const test = base.extend({

 loginPage: async ({ page }, use) => {
   const login = new LoginPage(page)
   await use(login)
 }

})


import test from ' customeFixture.ts'
test('test',async({page,LoginPage}))

Why fixtures are important

Reduce duplicate setup code

Improve test readability

Manage dependencies efficiently

Enable parallel execution safely

8.Why would you prefer fixtures instead of beforeEach hooks in a large automation framework?

Fixtures are preferred because they provide better dependency management and modular design.

Problems with beforeEach

Hard to reuse across files

Difficult dependency control

Not scalable

Advantages of fixtures

Dependency injection

Reusability

Clear test structure

Better parallel execution

Example usage:

test('login test', async ({ loginPage }) => {
  await loginPage.login()
})

Cleaner than writing login logic in beforeEach.
